# Add these to bay-ubicloud's bay.toml, under the commands table.
#
# Both pin the model and the effort. Unpinned, a review runs on whatever the
# box's account happens to default to, which moves between releases and differs
# per developer -- so the same pull request could be reviewed at two depths. An
# adversarial review runs unattended, so nobody is there to notice a shallow
# answer.
#
# bay run only executes commands defined here, so the dashboard cannot pass a
# prompt. review does not need one: bay up <box> --pr <n> already checked the
# worktree out at the pull request, so the diff against the base branch IS the
# subject. ask reads its prompt from a file the dashboard writes into the
# worktree, so free text never travels on a command line.
#
# Also add install-skills.sh to sync and setup in [box], so each developer's own
# Claude skills reach their boxes:
#
#   [box]
#   sync  = [..., "install-skills.sh"]
#   setup = ["bash /workspace/.bay/post-create.sh",
#            "bash /workspace/.bay/install-skills.sh"]
#
# The repo is named per person in ~/.bay/env, not here, so bay.toml stays shared:
#
#   CLAUDE_SKILLS_REPO=furkansahin/skills

[commands]
review = """
claude -p --model opus --effort max 'You are reviewing this pull request adversarially. \
Diff the working branch against origin/main and read every changed hunk. \
\
Look for defects that matter: logic that is wrong on some input, race \
conditions, unhandled errors, resource leaks, off-by-one and boundary bugs, \
SQL or shell injection, missing authorization checks, and data that crosses a \
trust boundary without validation. Check that the tests actually exercise the \
new behaviour rather than restating it. \
\
For each finding give the file and line, what input or state triggers it, and \
what goes wrong. Rank by severity. Say plainly when you are unsure rather than \
padding the list. If the change is sound, say so and stop - do not invent \
findings to fill space.' 2>&1
"""

# A follow-up in the same box, after the review. --continue resumes the review's
# own conversation, so the question has the whole review in context instead of
# starting cold. The prompt comes from the file the dashboard wrote.
#
# The -- is necessary. The shell quotes the text correctly, but the text is
# still an argument to claude. Without --, claude reads a question that starts
# with a dash as an option.
ask = """
cd /workspace && claude -p --continue --model opus --effort max -- "$(cat /workspace/.rq/followup.txt)" 2>&1
"""
